interface:
  display_name: "Embedding FT Worker"
  short_description: "Debug and run embedding worker jobs"
  default_prompt: "Call tiangong-lca directly from PATH; check required command help and install through official guidance if missing. Use $embedding-ft to validate an embedding job and run the remote smoke through the installed CLI OAuth session. Run `tiangong-lca auth doctor-auth --json` first; if login is required, hand the trusted terminal to the human and never request a password, code, token, or legacy API key. Use scripts/run-cli.mjs for direct CLI calls and --runtime-info for identity; inherit the configured installed CLI environment without reselecting a version. Preserve original managed-task runtime and UNKNOWN recovery actions. Ordinary independent CLI calls require the configured installation; never select or download a CLI version from the skill."
