  short_description: "Import LCA packages and develop TIDAS data from evidence"
  default_prompt: "Check applicable source/license permissions and project admission scope before assessment leads to remote persistence. Keep local-only material and its supporting Process/Flow/Source/Model objects out of remote drafts and authorization preparation; resolve unclear scope and use actual geographic evidence for project-specific requirements. Resolve file arguments from their intended caller base before a controlled host changes CWD. Local validation/conversion/extraction has no Skill-added remote identity preflight. Use $foundry-tidas-import through scripts/run-foundry.mjs using the environment-configured managed Foundry entry. Inspect runtime describe --json through the public installed entry for selected identity and required protocols; a CLI-only deployment may select TIANGONG_FOUNDRY_RUNTIME_CLI with verified release/protocol evidence and managed doctor; follow references/runtime-setup.md for missing configuration or capabilities. Summarize the user's goal and scope from supplied information, then continue only through the selected runtime's current public task actions. Explain genuine human blockers briefly and plainly with their impact, recommendation and a precise, easy-to-answer question; preserve decision-critical limits and complete indexed reference details for inspection. Retain raw replies and sources through registered interaction artifacts. For Process seeds and semantic work, distinguish intendedApplications, useAdviceForDataSet and technologicalApplicability using supplied context, preserving scientific limits and keeping task status in task evidence even without the internal authoring skill. Use task prepare-input only when the selected runtime explicitly exposes its interaction/semantic draft protocols, deriving bindings from current indexed evidence. An actual question followed by the already supplied reply may share one ordered interaction submission. Preserve the strict descriptor path for older runtimes and keep semantic work and approval separate. Carry applicable decisions into evidence-backed semantic work; when a current interaction state exists, bind semantic input to the current interaction-state SHA-256 and each work item's exact decision IDs, then inspect adopted_decisions. Keep AI assumptions distinct and give a concise decision recap from current task evidence. Distinguish a read-only runtime case from separately requested data repair. Preserve current task/account bindings, separately authorized writes and original-attempt readback; never treat a choice as scientific evidence or write permission. Ordinary independent CLI calls require the configured installation; never select or download a CLI version from the skill."
