interface:
  display_name: "Source Evidence Dataset Development"
  short_description: "Evidence-led data development with atomic CLI operations"
  default_prompt: "Check applicable source/license permissions and project admission scope before assessment leads to remote persistence. Keep local-only material and its supporting Process/Flow/Source/Model objects out of remote drafts and authorization preparation; resolve unclear scope and use actual geographic evidence for project-specific requirements. Resolve file arguments from their intended caller base before a controlled host changes CWD. Local validation/conversion/extraction has no Skill-added remote identity preflight. Use $source-evidence-dataset-development for evidence-led independent work with current typed dataset contract/search/get/validate and separate authorized create/save/review. Preserve provenance and confirmed readback. In a registered Foundry task consume the supplied brief, applicable decisions and structured actions; return input files or precise gaps to the ordinary Foundry entry without changing registered rows, reports, checkpoints or attempts. Keep user choices separate from source facts and write authority. Keep the standalone CLI procedure outside that managed task."
