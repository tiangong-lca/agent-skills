interface:
  display_name: "Process Automated Builder"
  short_description: "Run CLI-backed process evidence, identity, unit analysis, build, and publish gates"
  default_prompt: "Use $process-automated-builder to run the native Node .mjs wrapper for CLI-owned dataset evidence-search, process identity-preflight, build-plan validate/materialize, required-field completion, process-from-flow, publish-build, and local verification gates. Use the pinned published OAuth-only CLI 0.1.24 through pnpm unless an exact local CLI override is explicitly selected. Author the unit_of_analysis decision artifact before build-plan validation/materialization. Use the supplied Process context to distinguish intendedApplications, useAdviceForDataSet and technologicalApplicability; inspect the materialized purpose and preserve scientific limits while keeping task status in task evidence. Keep annual volume evidence-based (unknown stays the supported unknown representation) and consume the CLI validation-layer report instead of re-implementing validation. If the installed runtime still emits a numeric missing-volume sentinel or lacks that report, stop and report qualified adoption as incomplete; never hand-fabricate the empty array or bypass the runtime."
