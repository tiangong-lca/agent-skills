interface:
  display_name: "LCA Study"
  short_description: "Set up and develop evidence-led LCA models and analysis"
  default_prompt: "Use $lca-study to develop or continue my LCA research from goals and available materials. If the environment is unprepared, follow references/getting-started.md, verify available setup and report precise missing release or installation artifacts before CLI work. Preserve sources, extract modelable data and ask focused gap questions, build foreground processes and explicitly selected aggregate backgrounds, then calculate and interpret actual Model results through the qualified CLI. Compose an evidence-faithful report JSON and call report render for offline HTML with embedded Model visualization and browser PDF printing. Show one language at a time through the Chinese/English switch; do not implement a Skill renderer or infer missing calculations/translations. Keep normal sparse LCIA applicability separate from missing data. For calculation-only requests, return the actual result without requiring a report. Use hosted Study calculation, advanced analysis, method assessment, reports, recovery, review and sharing only when my requested scope needs them."
