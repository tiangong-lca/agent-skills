name: validate-skills

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "foundry-tidas-import/**"
      - "foundry-tidas-authoring/**"
      - "test/foundry-*.test.mjs"
      - "scripts/lib/**"
      - "scripts/run-cli.mjs"
      - "scripts/inspect-local-cli.mjs"
      - "lca-study/**"
      - "flow-hybrid-search/**"
      - "process-hybrid-search/**"
      - "lifecyclemodel-resulting-process-builder/**"
      - "process-automated-builder/**"
      - "flow-governance-review/**"
      - "test/**"
      - "AGENTS.md"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/agents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout tiangong-lca-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: tiangong-lca/cli
          ref: 89c71772ca1afcfc09705f8c27a9703c6bf8ccf6
          path: .ci/tiangong-lca-cli

      - name: Set up pnpm 11.24.0 and Node 24.19.0
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install Skills validation package
        run: pnpm install --frozen-lockfile

      - name: Install and build CLI
        working-directory: .ci/tiangong-lca-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test Skills repository contracts
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/foundry-skill-install
        # Private PowerShell and copied native consumers keep their existing
        # deadlines; Windows test files receive exclusive runner scheduling.
        run: pnpm test ${{ matrix.os == 'windows-latest' && '--test-concurrency=1' || '' }}

      - name: Preserve copied public Foundry install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundry-skill-install-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/foundry-skill-install/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate skills
        env:
          TIANGONG_LCA_CLI_DIR: ${{ github.workspace }}/.ci/tiangong-lca-cli
        run: pnpm validate
