name: validate-skills

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "foundry-tidas-import/**"
      - "foundry-tidas-authoring/**"
      - "test/foundry-*.test.mjs"
      - "scripts/lib/**"
      - "scripts/run-cli.mjs"
      - "scripts/inspect-local-cli.mjs"
      - "lca-study/**"
      - "flow-hybrid-search/**"
      - "process-hybrid-search/**"
      - "lifecyclemodel-resulting-process-builder/**"
      - "process-automated-builder/**"
      - "flow-governance-review/**"
      - "**/SKILL.md"
      - "**/agents/openai.yaml"
      - "**/references/**"
      - "**/assets/**"
      - "**/scripts/**"
      - "test/**"
      - "AGENTS.md"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/agents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: "Run one bounded Windows Foundry environment/sequential control (diagnostic only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skills-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ !inputs.windows_diagnostics }}
    name: plan validation lane
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout skills for lane planning
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify exact skills validation lane
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          full_matrix='[{"os":"ubuntu-latest","arch":"x64"},{"os":"windows-latest","arch":"x64","shard":"foundry-core","shard_label":"foundry-core"},{"os":"windows-latest","arch":"x64","shard":"foundry-interaction","shard_label":"foundry-interaction"},{"os":"windows-latest","arch":"x64","shard":"foundry-object-scope","shard_label":"foundry-object-scope"},{"os":"windows-latest","arch":"x64","shard":"contracts","shard_label":"contracts"},{"os":"macos-latest","arch":"arm64"},{"os":"ubuntu-24.04-arm","arch":"arm64"}]'
          fast_matrix='[{"os":"ubuntu-latest","arch":"x64"}]'

          emit() {
            echo "Skills CI lane: mode=$1 reason=$2"
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            echo "matrix=$3" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            emit full "non-pr-event" "$full_matrix"
          fi
          if [ "$HAS_FULL_LABEL" = "true" ]; then
            emit full "ci-full-label" "$full_matrix"
          fi
          if ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            emit full "unproven-pr-commits" "$full_matrix"
          fi
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" || ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            emit full "missing-pr-history" "$full_matrix"
          fi
          changed_count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            changed_count=$((changed_count + 1))
            case "$file" in
              AGENTS.md|README.md|README.zh-CN.md|.docpact/config.yaml|docs/agents/*|.claude-plugin/marketplace.json|.github/dependabot.yml|*/SKILL.md|*/agents/openai.yaml|*/references/*|*/assets/*)
                ;;
              *)
                emit full "runtime-test-or-workflow-path:$file" "$full_matrix"
                ;;
            esac
          done < <(git diff --name-only --no-renames "${PR_BASE_SHA}...${PR_HEAD_SHA}")
          if [ "$changed_count" -eq 0 ]; then
            emit full "empty-diff" "$full_matrix"
          fi
          emit pr-fast "docs-and-skill-metadata-only-pr" "$fast_matrix"

  validate:
    needs: plan
    if: ${{ !inputs.windows_diagnostics }}
    name: validate (${{ matrix.os }} / ${{ matrix.arch }}${{ matrix.shard_label && format(' / {0}', matrix.shard_label) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout tiangong-lca-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: tiangong-lca/cli
          ref: 955642482771a270fd49a199d1d7c86fcccc9ce2
          path: .ci/tiangong-lca-cli

      - name: Set up pnpm 11.24.0 and Node 24.19.0
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install Skills validation package
        run: pnpm install --frozen-lockfile

      - name: Restore built pinned CLI cache
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/tiangong-lca-cli/node_modules
            .ci/tiangong-lca-cli/dist
          key: skills-pinned-cli-v1-${{ runner.os }}-${{ runner.arch }}-node24.19.0-pnpm11.24.0-955642482771a270fd49a199d1d7c86fcccc9ce2

      - name: Install and build CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        working-directory: .ci/tiangong-lca-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Qualify the pinned CLI test fixture
        run: node scripts/qualify-ci-cli.mjs

      - name: Test Skills repository contracts
        if: ${{ !matrix.shard }}
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/foundry-skill-install
        run: pnpm test

      - name: Test Skills repository contracts (Windows balanced shard)
        if: ${{ matrix.shard }}
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/foundry-skill-install
        # Private PowerShell and copied native consumers keep their existing
        # deadlines; Windows test files receive exclusive runner scheduling across balanced shards.
        run: node scripts/lib/ci-test-shard.mjs run ${{ matrix.shard }}

      - name: Preserve copied public Foundry install evidence
        if: always() && matrix.shard != 'contracts'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundry-skill-install-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.shard_label && format('-{0}', matrix.shard_label) || '' }}
          path: ${{ runner.temp }}/foundry-skill-install/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate skills
        if: ${{ !matrix.shard || matrix.shard == 'contracts' }}
        env:
          TIANGONG_LCA_CLI_DIR: ${{ github.workspace }}/.ci/tiangong-lca-cli
        run: pnpm validate

  windows-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node toolchain
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: false
      - name: Run bounded Windows controls
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/skills144-windows-diagnostics
        run: node scripts/lib/windows-foundry-diagnostics.mjs
      - name: Preserve diagnostic receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skills144-windows-diagnostics
          path: ${{ runner.temp }}/skills144-windows-diagnostics/*
          if-no-files-found: error
          retention-days: 30
