name: validate-skills

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "foundry-tidas-import/**"
      - "foundry-tidas-authoring/**"
      - "test/foundry-*.test.mjs"
      - "scripts/lib/**"
      - "scripts/run-cli.mjs"
      - "scripts/inspect-local-cli.mjs"
      - "lca-study/**"
      - "flow-hybrid-search/**"
      - "process-hybrid-search/**"
      - "lifecyclemodel-resulting-process-builder/**"
      - "process-automated-builder/**"
      - "flow-governance-review/**"
      - "**/SKILL.md"
      - "**/agents/openai.yaml"
      - "**/references/**"
      - "**/assets/**"
      - "**/scripts/**"
      - "test/**"
      - "AGENTS.md"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/agents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: "Run one bounded Windows Foundry environment/sequential control (diagnostic only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skills-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ !inputs.windows_diagnostics }}
    name: validate (${{ matrix.os }} / ${{ matrix.arch }}${{ matrix.shard_label && format(' / {0}', matrix.shard_label) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
            shard: "1/3"
            shard_label: "1-of-3"
          - os: windows-latest
            arch: x64
            shard: "2/3"
            shard_label: "2-of-3"
          - os: windows-latest
            arch: x64
            shard: "3/3"
            shard_label: "3-of-3"
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout tiangong-lca-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: tiangong-lca/cli
          ref: 955642482771a270fd49a199d1d7c86fcccc9ce2
          path: .ci/tiangong-lca-cli

      - name: Set up pnpm 11.24.0 and Node 24.19.0
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install Skills validation package
        run: pnpm install --frozen-lockfile

      - name: Install and build CLI
        working-directory: .ci/tiangong-lca-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Qualify the pinned CLI test fixture
        run: node scripts/qualify-ci-cli.mjs

      - name: Test Skills repository contracts
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/foundry-skill-install
        # Private PowerShell and copied native consumers keep their existing
        # deadlines; Windows test files receive exclusive runner scheduling across 3 shards.
        run: pnpm test ${{ matrix.os == 'windows-latest' && '--test-concurrency=1' || '' }} ${{ matrix.shard && format('--test-shard={0}', matrix.shard) || '' }}

      - name: Preserve copied public Foundry install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundry-skill-install-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.shard_label && format('-{0}', matrix.shard_label) || '' }}
          path: ${{ runner.temp }}/foundry-skill-install/*.json
          if-no-files-found: ${{ matrix.shard && 'ignore' || 'error' }}
          retention-days: 30

      - name: Validate skills
        if: ${{ !matrix.shard || matrix.shard == '1/3' }}
        env:
          TIANGONG_LCA_CLI_DIR: ${{ github.workspace }}/.ci/tiangong-lca-cli
        run: pnpm validate

  windows-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node toolchain
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: false
      - name: Run bounded Windows controls
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/skills144-windows-diagnostics
        run: node scripts/lib/windows-foundry-diagnostics.mjs
      - name: Preserve diagnostic receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skills144-windows-diagnostics
          path: ${{ runner.temp }}/skills144-windows-diagnostics/*
          if-no-files-found: error
          retention-days: 30
