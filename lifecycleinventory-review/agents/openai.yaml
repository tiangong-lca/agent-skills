interface:
  display_name: "Lifecycle Inventory Review"
  short_description: "Review local or frozen remote process/lifecyclemodel LCI outputs"
  default_prompt: "Use $lifecycleinventory-review for local or frozen remote QA. Read public Process naming definitions through `node scripts/read-public-rule.mjs --rule-id <id>` before applying them; retain product-local QA policy. Apply the Process rubric's semantic purpose/use-text check from actual supplied context: distinguish intendedApplications, useAdviceForDataSet and technologicalApplicability, identify exact offending text and repair, preserve scientific limits, and report unchecked or unavailable context honestly. Before remote snapshots check CLI auth status and doctor-auth, keep account sessions separate, hand login to the human, and never request a password, code, token, or legacy API key."
